name: Build LLVM AArch64 Backend on ubuntu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone LLVM Source
        run: |
          git clone --depth=1 https://github.com/llvm/llvm-project.git

      - name: Replace AArch64ConditionOptimizer.cpp
        run: |
          cp .github/workflows/AArch64ConditionOptimizer.cpp \
            llvm-project/llvm/lib/Target/AArch64/AArch64ConditionOptimizer.cpp

      - name: Configure CMake
        run: |
          cmake -S llvm-project/llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Install
        run: |
          cmake --install build --prefix install

      - name: Upload Complete LLVM Package
        uses: actions/upload-artifact@v4
        with:
          name: llvm-aarch64-full
          path: install/
          retention-days: 7
